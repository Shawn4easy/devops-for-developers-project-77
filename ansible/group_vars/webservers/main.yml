ansible_user: ubuntu
ansible_ssh_private_key_file: "{{ admin_ssh_private_key_path }}"
# Машины пересоздаются Terraform, и ключ хоста каждый раз новый.
ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"

docker_registry_mirrors:
  - https://mirror.gcr.io

blog_image: shawn4easy/devops-for-programmers-project-lvl1
blog_image_tag: latest
blog_container_name: blog
blog_port: 8080
blog_dir: /opt/blog

blog_db_host: "{{ db_host }}"
blog_db_port: 6432
blog_db_name: app
blog_db_user: app
blog_db_password: "{{ vault_db_password }}"

# Агент DataDog проверяет приложение на своём сервере. Имя экземпляра
# попадает в тег instance, по нему работает монитор из terraform/monitoring.tf.
datadog_agent_major_version: 7
datadog_checks:
  http_check:
    init_config:
    instances:
      - name: blog
        url: "http://localhost:{{ blog_port }}/"
        timeout: 5

# Роль скачивает APT-ключи DataDog с s3.amazonaws.com без повторов, а связь
# с AWS из облака бывает нестабильной. Ключи скачиваются заранее с повторами,
# роль берёт их из локальных файлов.
datadog_apt_key_base_url: https://s3.amazonaws.com/public-signing-keys
datadog_apt_keys_dir: /etc/apt/keyrings/datadog
datadog_apt_default_keys:
  - key: DATADOG_APT_KEY_CURRENT
    value: "file://{{ datadog_apt_keys_dir }}/DATADOG_APT_KEY_CURRENT.public"
  - key: A2923DFF56EDA6E76E55E492D3A80E30382E94DE
    value: "file://{{ datadog_apt_keys_dir }}/DATADOG_APT_KEY_382E94DE.public"
  - key: D75CEA17048B9ACBF186794B32637D44F14F620E
    value: "file://{{ datadog_apt_keys_dir }}/DATADOG_APT_KEY_F14F620E.public"
  - key: 5F1E256061D813B125E156E8E6266D4AC0962C7D
    value: "file://{{ datadog_apt_keys_dir }}/DATADOG_APT_KEY_C0962C7D.public"
  - key: D18886567EABAD8B2D2526900D826EB906462314
    value: "file://{{ datadog_apt_keys_dir }}/DATADOG_APT_KEY_06462314.public"
